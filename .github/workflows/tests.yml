name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify installed command-line workflow
        run: |
          agritech-irrigation design examples/drip_irrigation_design.json --output /tmp/agritech-report.json
          python -c "import json; report=json.load(open('/tmp/agritech-report.json', encoding='utf-8')); assert 'sector_analysis' in report and 'pump_system_analysis' in report and 'design_duty' in report"

      - name: Run tests
        run: python -m pytest irrigation/tests -v
